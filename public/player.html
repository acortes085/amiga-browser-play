<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Amiga Player</title>
<style>html,body{margin:0;height:100%;background:#000}#game{width:100%;height:100%}</style>
</head>
<body>
<div id="game"></div>
<script>
  const p = new URLSearchParams(location.search);
  const slug = p.get("slug") || "custom-game";
  const isCustom = p.get("custom") === "1";
  const premium = p.get("premium") === "1" || isCustom;
  // Los usuarios no premium solo pueden arrancar desde el inicio
  const mode = premium ? (p.get("mode") || "start") : "start";
  const DB = "amiga-saves", STORE = "states";
  function db() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(STORE);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function put(v) {
    const d = await db();
    return new Promise((res) => { const t = d.transaction(STORE, "readwrite"); t.objectStore(STORE).put(v, slug); t.oncomplete = res; });
  }
  async function get() {
    const d = await db();
    return new Promise((res) => { const q = d.transaction(STORE).objectStore(STORE).get(slug); q.onsuccess = () => res(q.result); q.onerror = () => res(null); });
  }

  // Resolver origen del juego: si es juego propio del usuario y el frame padre
  // comparte la referencia directa al Blob, creamos la URL dentro de este propio contexto
  // para evitar problemas de particionamiento o revocación en React StrictMode.
  let gameUrl = p.get("game");
  if (isCustom && window.parent) {
    try {
      const parentBlob = window.parent.__amigaCustomBlob;
      if (parentBlob) {
        gameUrl = URL.createObjectURL(parentBlob);
      }
    } catch (err) {
      console.warn("[player] No se pudo obtener blob del padre:", err);
    }
  }

  window.EJS_player = "#game";
  window.EJS_core = "puae";
  window.EJS_gameUrl = gameUrl;
  window.EJS_biosUrl = p.get("bios") || "/amiga/kick34005.A500";
  window.EJS_gameID = slug;
  window.EJS_gameName = p.get("name") || slug;
  window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
  window.EJS_startOnLoaded = true;
  window.EJS_language = "es-ES";
  window.addEventListener("click", () => window.focus());
  if (mode === "point" && p.get("state")) window.EJS_loadStateURL = p.get("state");
  // Botones de la barra de EmulatorJS: los premium ven todos; el resto solo los basicos
  // (se mantiene diskButton para poder cambiar de disco en juegos multidisco)
  if (!premium) {
    window.EJS_Buttons = {
      settings: false,
      saveState: false,
      loadState: false,
      quickSave: false,
      quickLoad: false,
      saveSavFiles: false,
      loadSavFiles: false,
      cheat: false,
      screenRecord: false,
      cacheManager: false,
      netplay: false,
      contextMenu: false
    };
  }

  // Guardar estado: se guarda en el navegador en lugar de descargarse
  window.EJS_onSaveState = async (e) => {
    await put({ state: e.state, date: Date.now() });
    parent.postMessage({ type: "amiga-saved", slug }, location.origin);
  };
  window.EJS_onLoadState = async () => {
    const s = await get();
    if (s) window.EJS_emulator.gameManager.loadState(s.state);
  };
  window.EJS_onGameStart = async () => {
    try { window.EJS_emulator.gameManager.setKeyboardEnabled(true); } catch (err) { console.warn("[player] teclado", err); }
    if (mode === "saved") {
      const s = await get();
      if (s) setTimeout(() => window.EJS_emulator.gameManager.loadState(s.state), 500);
    }
  };
</script>
<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
<script>
  // Parche: EmulatorJS (stable) falla al montar el menu "Disks" de juegos con .m3u
  // ("Cannot set properties of undefined (setting 'disk')") y aborta el arranque.
  // Envolvemos menuOptionChanged para que ese error no detenga el juego.
  (function patchEJS() {
    if (typeof EmulatorJS === "undefined" || !EmulatorJS.prototype.menuOptionChanged) return setTimeout(patchEJS, 5);
    if (EmulatorJS.prototype.__patched) return;
    const orig = EmulatorJS.prototype.menuOptionChanged;
    EmulatorJS.prototype.menuOptionChanged = function (...args) {
      try { return orig.apply(this, args); }
      catch (err) { console.warn("[player] menuOptionChanged ignorado:", args[0], err); }
    };
    EmulatorJS.prototype.__patched = true;
  })();
</script>
</body>
</html>
